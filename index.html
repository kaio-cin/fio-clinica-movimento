<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fio · Clínica Movimento</title>
<meta name="description" content="Protótipo navegável do Fio: o tratamento como um fio de 10 nós, para a Clínica Movimento.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>/* Fio · protótipo para a Clínica Movimento. Tema escuro em petróleo; o fio de três cores (anil, petróleo, açafrão) é a assinatura. */
:root {
  --bg: #10191b; --bg-deep: #0b1314; --surface: #172427; --surface-2: #1c2d30;
  --line: rgba(241,236,226,.10); --line-strong: rgba(241,236,226,.20);
  --text: #f1ece2; --muted: rgba(241,236,226,.68); --label: #a3aba7;
  --marca: #3cc7b0; --marca-hover: #5bd8c3; --marca-linha: rgba(60,199,176,.45); --sobre-marca: #0b1314;
  --acento: #f2b654;
  --ok: #45c08a; --warn: #f2b654; --risk: #ff7a5c;
  --cause-renovacao: #8c9bff; --cause-rampa: #e07bc0; --cause-pico: #f0a649; --cause-esquecimento: #a3aba7;
  --fio-a: #8c9bff; --fio-b: #3cc7b0; --fio-c: #f2b654; --no: #3cc7b0;
  --futuro: rgba(241,236,226,.22); --futuro-forte: rgba(241,236,226,.36);
  --sombra: 0 24px 60px -30px rgba(0,0,0,.75);
  --vidro: rgba(16,25,27,.72); --gaveta-bg: rgba(16,25,27,.95); --veu-bg: rgba(4,8,9,.55);
  --toast-bg: #1c2d30; --toast-txt: #f1ece2;
  --font: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.2,.8,.2,1); --salto: cubic-bezier(.34,1.56,.64,1);
  --no-fundo: var(--bg);
  color-scheme: dark;
}
html, body { background: var(--bg); color: var(--text); margin: 0; transition: background-color .5s var(--ease); }
body { font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
#raiz { min-height: 100vh; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  /* trama de linho bem sutil + duas luzes nos cantos */
  background:
    radial-gradient(760px 520px at 96% -6%, color-mix(in srgb, var(--acento) 13%, transparent), transparent 70%),
    radial-gradient(700px 600px at -8% 104%, color-mix(in srgb, var(--marca) 10%, transparent), transparent 70%),
    repeating-linear-gradient(0deg, color-mix(in srgb, var(--text) 1.6%, transparent) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--text) 1.3%, transparent) 0 1px, transparent 1px 5px);
  background-attachment: fixed; }
* { box-sizing: border-box; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
.tnum, .numfio-v, .lv-hora, .grade-hora, .contagem { font-variant-numeric: tabular-nums; }

/* ---------- topo: o menu é um fio com 5 nós ---------- */
.topo { position: sticky; top: 0; z-index: 40; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  background: var(--vidro); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); border-bottom: 1px solid var(--line); }
.topo-linha { max-width: 1300px; margin: 0 auto; min-height: 70px; display: grid; grid-template-columns: minmax(180px, 1fr) minmax(0, 640px) minmax(180px, 1fr); align-items: center; gap: 20px; }
.topo-marca { display: flex; align-items: baseline; gap: 14px; }
.topo-cliente { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.topo-cliente b { font-weight: 600; color: var(--text); }
.topo-dir { justify-self: end; display: flex; gap: 10px; align-items: center; }
.trilho { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); padding: 10px 0 8px; }
.trilho-linha { position: absolute; left: 10%; right: 10%; top: 23px; height: 2px; border-radius: 1px; background: var(--line-strong); overflow: hidden; }
.trilho-linha b { display: block; height: 100%; background: linear-gradient(90deg, var(--fio-a), var(--fio-b), var(--fio-c)); transition: width .7s var(--ease); }
.trilho a { position: relative; display: grid; justify-items: center; gap: 4px; min-width: 0; font-size: 12.5px; color: var(--muted); transition: color .2s; }
.trilho-no { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1.5px solid var(--line-strong);
  font: 600 11.5px var(--mono); color: var(--label); transition: transform .25s var(--salto), background .25s, border-color .25s, color .25s, box-shadow .25s; }
.trilho-nome { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.trilho a:hover { color: var(--text); }
.trilho a:hover .trilho-no { transform: scale(1.12); border-color: var(--marca); color: var(--marca); }
.trilho a.antes .trilho-no { border-color: var(--marca); color: var(--marca); }
.trilho a.on { color: var(--text); font-weight: 700; }
.trilho a.on .trilho-no { background: var(--marca); border-color: var(--marca); color: var(--sobre-marca); box-shadow: 0 0 0 5px color-mix(in srgb, var(--marca) 16%, transparent); animation: pop .35s var(--salto); }
.topo-sub { max-width: 1300px; margin: 0 auto; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-top: 1px solid var(--line); }
.sub-dir { display: flex; align-items: center; gap: 10px; }
.logo { position: relative; display: inline-flex; align-items: flex-end; font-weight: 600; font-size: 28px; letter-spacing: -.04em; line-height: 1; padding-bottom: 5px; color: var(--text); }
.logo-i { position: relative; }
.logo-i i { position: absolute; left: 50%; top: -3px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--acento); box-shadow: 0 0 0 2px color-mix(in srgb, var(--acento) 22%, transparent); }
.logo-linha { position: absolute; left: 0; right: -6px; bottom: 0; height: 7px; width: calc(100% + 8px); }
.logo-linha path { fill: none; stroke: var(--fio-b); stroke-width: 1.6; stroke-dasharray: 1; stroke-dashoffset: 1; animation: tracar .9s var(--ease) .2s forwards; vector-effect: non-scaling-stroke; }
.logo.grande { font-size: 76px; padding-bottom: 14px; }
.logo.grande .logo-i i { width: 15px; height: 15px; margin-left: -7.5px; top: -4px; }
.logo.grande .logo-linha { height: 14px; }
.abas { display: flex; gap: 2px; }
.abas a { position: relative; display: inline-flex; align-items: center; gap: 7px; padding: 14px 12px; font-size: 14px; font-weight: 500; color: var(--muted); transition: color .2s; white-space: nowrap; }
.abas a:hover { color: var(--text); }
.abas a.on { color: var(--text); font-weight: 700; }
.abas a::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 1px; background: var(--marca); transform: scaleX(0); transition: transform .35s var(--ease); }
.abas a.on::after { transform: scaleX(1); }
.badge { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 9999px; background: color-mix(in srgb, var(--text) 9%, transparent); color: var(--text); font: 700 11px var(--font); animation: pop .3s var(--salto); }
.badge.quente { background: var(--acento); color: #1d2826; }
.unid { display: flex; border: 1px solid var(--line-strong); border-radius: 10px; padding: 3px; background: var(--surface); }
.unid button { font-size: 12.5px; padding: 4px 10px; border-radius: 7px; color: var(--muted); }
.unid button.on { background: color-mix(in srgb, var(--marca) 13%, transparent); color: var(--text); font-weight: 600; }
.nav-data { font-size: 13px; color: var(--muted); white-space: nowrap; }
.lupa { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); border: 1px solid var(--line-strong); background: var(--surface); }
.lupa:hover { color: var(--text); border-color: var(--marca); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; background: color-mix(in srgb, var(--acento) 25%, var(--surface)); color: var(--text); }

/* ---------- tipografia ---------- */
.rotulo { font-size: .6875rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--marca); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.titulo { position: relative; display: grid; gap: 12px; }
.titulo h1 { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.02; letter-spacing: -.03em; font-weight: 600; }
.titulo.h2 h1 { font-size: clamp(1.6rem, 2.8vw, 2.1rem); }
.leve { font-weight: 300; }
.forte { font-weight: 700; }
.terceira { display: block; font-weight: 300; color: var(--muted); }
.display { font-size: clamp(2.5rem, 6vw, 4.5rem); line-height: 1; letter-spacing: -.03em; font-weight: 400; }
/* destaque: a palavra ganha um fio ondulado por baixo */
.grad { color: var(--marca); text-decoration: underline wavy var(--acento); text-decoration-thickness: .06em; text-underline-offset: .16em; text-decoration-skip-ink: none; }
.lead { font-size: 1.0625rem; line-height: 1.65; color: var(--muted); max-width: 62ch; }
.nota { font-size: .875rem; color: var(--muted); line-height: 1.55; }
.fantasma { position: absolute; font-size: 200px; line-height: .8; font-weight: 300; letter-spacing: -.05em; color: color-mix(in srgb, var(--text) 6%, transparent); pointer-events: none; user-select: none; }
.link-verde { color: var(--marca); font-size: 14px; font-weight: 600; }
.link-verde:hover { text-decoration: underline wavy var(--acento); text-underline-offset: 4px; }
kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; background: var(--surface); font: 600 11px var(--mono); color: var(--text); }

/* ---------- botões, chips, estados ---------- */
.btn { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 20px; border-radius: 12px; font-weight: 700; font-size: 15px; white-space: nowrap;
  transition: background .2s var(--ease), transform .2s var(--ease), border-color .2s, color .2s, box-shadow .2s; }
.btn.peq { height: 38px; padding: 0 14px; font-size: 13.5px; gap: 8px; border-radius: 10px; }
.btn-principal { background: var(--marca); color: var(--sobre-marca); box-shadow: 0 1px 0 color-mix(in srgb, var(--text) 10%, transparent), 0 8px 18px -10px var(--marca-linha); }
.btn-principal:hover:not(:disabled) { background: var(--marca-hover); transform: translateY(-2px); box-shadow: 0 12px 24px -12px var(--marca-linha); }
.btn-secundario { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); font-weight: 600; }
.btn-secundario:hover:not(:disabled) { border-color: var(--marca); color: var(--marca); }
.btn-texto { color: var(--muted); padding: 0 8px; font-weight: 600; }
.btn-texto:hover { color: var(--text); }
.btn:disabled { opacity: .4; }
.btn .seta { transition: transform .2s var(--ease); }
.btn:hover .seta { transform: translateX(4px); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 9999px; border: 1px solid color-mix(in srgb, var(--text) 15%, transparent); font-size: 13px; color: var(--text); white-space: nowrap; transition: border-color .2s, background .2s; }
button.chip:hover { border-color: color-mix(in srgb, var(--marca) 50%, transparent); }
.chip.ativo { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 700; }
.chip-causa { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 3px 12px 3px 10px; border-radius: 9999px; font-size: 13px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); color: var(--text); }
.chip-causa i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.chip-causa b { font-weight: 600; color: var(--c); }
.c-renovacao { --c: var(--cause-renovacao); } .c-rampa { --c: var(--cause-rampa); } .c-pico { --c: var(--cause-pico); } .c-esquecimento { --c: var(--cause-esquecimento); } .c-fila { --c: var(--cause-fila); }
.estado { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.estado i { width: 7px; height: 7px; border-radius: 50%; background: var(--label); flex: none; }
.e-confirmado i, .e-veio i, .e-ok i, .e-reocupado i { background: var(--ok); }
.e-aguardando i { background: var(--label); animation: pulsoPonto 1.8s ease-in-out infinite; }
.e-faltou i, .e-tarde i, .e-risk i { background: var(--risk); }
.e-antes i { background: transparent; border: 1.5px dashed var(--label); }
.e-remarcou i { background: #6e9bff; }
.e-emprestado i { background: transparent; border: 1.5px dashed var(--marca); }
.e-vaga i, .e-warn i { background: var(--warn); }
.e-ok, .e-veio { color: var(--text); } .e-risk { color: var(--risk); } .e-warn { color: var(--warn); }
.simulacao { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 9999px; border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: lowercase; }
.fase2 { display: inline-flex; align-items: center; height: 22px; padding: 0 10px; border-radius: 9999px; background: color-mix(in srgb, var(--cause-renovacao) 14%, transparent); color: var(--cause-renovacao); font-size: 11px; font-weight: 600; }
.etiqueta-ambar { display: inline-block; margin-top: 16px; padding: 6px 12px; border-radius: 9999px; border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); font-size: 13px; }
.dica-teclas { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
  max-width: min(560px, calc(100vw - 40px)); padding: 7px 12px; border-radius: 12px; background: var(--vidro); border: 1px solid var(--line); font-size: 12px; box-shadow: var(--sombra); color: var(--muted); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.mono { display: inline-grid; place-items: center; flex: none; border-radius: 50%; font-weight: 600; color: var(--text); background: color-mix(in srgb, var(--mc) 24%, var(--bg)); border: 1px solid color-mix(in srgb, var(--mc) 45%, transparent); }
.tique path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: tracar .4s var(--ease) forwards; }

/* ---------- cartões ---------- */
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: var(--sombra); --no-fundo: var(--surface); transition: border-color .25s var(--ease), transform .25s var(--ease), box-shadow .25s; }
.card-link { position: relative; display: grid; gap: 8px; align-content: start; min-height: 170px; }
.card-link:hover { border-color: var(--marca-linha); transform: translateY(-4px); }
.card-link h3 { font-size: 1.375rem; letter-spacing: -.02em; font-weight: 500; }
.card-link p { color: var(--muted); font-size: 14.5px; }
.seta-canto { position: absolute; right: 22px; bottom: 18px; color: var(--marca); transition: transform .2s var(--ease); }
.card-link:hover .seta-canto { transform: translateX(4px); }

/* ---------- número com fio vertical ---------- */
.numfio { position: relative; padding-left: 18px; display: grid; gap: 4px; align-content: start; }
.numfio::before { content: ""; position: absolute; left: 0; top: 8px; height: 46px; width: 3px; border-radius: 2px; background: linear-gradient(var(--fio-a), var(--fio-b), var(--fio-c)); }
.numfio-v { font-size: 52px; font-weight: 300; letter-spacing: -.04em; line-height: 1.05; font-variant-numeric: lining-nums tabular-nums; }
.numfio-l { font-size: 14px; color: var(--text); max-width: 26ch; }
.numfio-s { font-size: 12.5px; color: var(--muted); max-width: 34ch; }

/* ---------- o fio ---------- */
.fio { width: 100%; }
.fio svg { overflow: visible; }
.fio-data { font: 500 11px var(--font); fill: var(--muted); font-variant-numeric: tabular-nums; }
.tracar { stroke-dasharray: 1; stroke-dashoffset: 1; animation: tracar .9s var(--ease) forwards; }
.tracar.lento { animation-duration: 1.4s; }
.desfiar { stroke-dasharray: 1; stroke-dashoffset: 1; animation: tracar .8s var(--ease) .2s forwards; }
.pop { animation: pop .3s var(--salto) both; }
.pulso { animation: pulso 1.6s ease-out infinite; }
.costura line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: tracar .45s var(--ease) .3s forwards; }
.costura line + line { animation-delay: .55s; }
.anel { transition: stroke-dasharray .6s var(--ease); }
.dica { position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); white-space: nowrap; padding: 6px 10px; border-radius: 10px; background: var(--toast-bg); font-size: 12px; color: var(--toast-txt); pointer-events: none; z-index: 5; }
@keyframes tracar { to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes pulso { from { transform: scale(1); opacity: .55; } to { transform: scale(1.8); opacity: 0; } }
@keyframes pulsoPonto { 50% { opacity: .35; } }
@keyframes entrar { from { opacity: 0; transform: translateY(12px); } }

/* ---------- gaveta, véu, aviso ---------- */
.veu { position: fixed; inset: 0; z-index: 70; background: var(--veu-bg); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
.veu.on { opacity: 1; pointer-events: auto; }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; z-index: 71; width: min(440px, 100vw); padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 24px 24px; overflow-y: auto;
  background: var(--gaveta-bg); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-left: 1px solid var(--line); box-shadow: -30px 0 60px -40px rgba(0,0,0,.4); transform: translateX(105%); transition: transform .35s var(--ease); --no-fundo: var(--surface); }
.gaveta.on { transform: none; }
.gaveta-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
.gaveta-topo h2 { font-size: 1.6rem; letter-spacing: -.02em; font-weight: 500; margin-top: 8px; }
.fechar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); font-size: 22px; line-height: 1; color: var(--muted); }
.fechar:hover { color: var(--text); border-color: var(--line-strong); }
.toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px);
  padding: 11px 18px; border-radius: 14px; background: var(--toast-bg); color: var(--toast-txt); font-size: 14px; font-weight: 500; animation: entrar .35s var(--ease); box-shadow: 0 18px 40px -20px rgba(0,0,0,.6); }

/* ---------- páginas ---------- */
.pagina { padding-bottom: 90px; }
.conteudo { max-width: 1200px; margin: 0 auto; padding-top: 56px; display: grid; gap: 36px; }
.conteudo.largo { max-width: 1300px; }
.conteudo > *, .secao > *, .hoje-grade > *, .fila-grade > *, .gal-grade > *, .cena > * { min-width: 0; }
.secao { max-width: 1200px; margin: 0 auto; padding-top: 72px; display: grid; gap: 36px; }
.titulo-acoes { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.desativado { display: inline-flex; gap: 8px; align-items: center; }

/* capa */
.heroi { position: relative; max-width: 1200px; margin: 0 auto; min-height: 560px; display: flex; align-items: center; }
.feixe { position: absolute; inset: 0 -40px 0 30%; width: calc(70% + 40px); height: 100%; }
.heroi-txt { position: relative; display: grid; gap: 22px; max-width: 640px; padding: 70px 0 40px; }
.acoes { display: flex; gap: 12px; flex-wrap: wrap; }
.marquise { margin: 40px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; border-block: 1px solid var(--line); overflow: hidden; padding: 16px 0; }
.marquise-trilho { display: flex; gap: 28px; width: max-content; animation: marquise 40s linear infinite; font-size: 13px; letter-spacing: .2em; color: var(--label); }
.marquise:hover .marquise-trilho { animation-play-state: paused; }
.estrela { color: var(--marca); }
@keyframes marquise { to { transform: translateX(-50%); } }
.numeros-caso { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.superficies { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }

/* ---------- história ---------- */
.historia { padding-bottom: 0; }
.segmentado { position: relative; display: inline-grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); }
.segmentado button { position: relative; z-index: 1; padding: 8px 16px; font-size: 14px; font-weight: 600; border-radius: 9px; color: var(--muted); transition: color .35s var(--ease); white-space: nowrap; }
.segmentado button.on { color: var(--sobre-marca); font-weight: 600; }
.segmentado-fundo { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 9px; background: var(--marca); transition: transform .35s var(--ease); }
.segmentado[data-v="com"] .segmentado-fundo { transform: translateX(100%); }
.cena { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; padding-top: 26px; transition: filter .5s var(--ease); }
.v-sem .cena, .v-sem .linha-tempo .lt-fio { filter: grayscale(1); }
.cena-esq { position: relative; display: grid; gap: 22px; align-content: start; padding-top: 14px; }
.cena-fantasma { top: -18px; left: -14px; font-size: 220px; }
.cena-titulo { position: relative; display: grid; gap: 14px; animation: entrar .35s var(--ease); }
.cena-titulo h1 { font-size: clamp(2.2rem, 4.2vw, 3.5rem); line-height: 1.02; letter-spacing: -.03em; }
.cena-recorte { position: relative; z-index: 2; max-width: 420px; justify-self: end; margin-right: -12px; animation: entrar .35s var(--ease); }
.cena-dir { display: flex; justify-content: center; }
.tel-zoom { zoom: .68; }
.recorte { display: grid; gap: 14px; box-shadow: 0 24px 60px -30px rgba(0,0,0,.7); }
.rec-pac { display: flex; align-items: center; gap: 12px; }
.rec-pac b { display: block; font-weight: 600; }
.rec-pac small { color: var(--muted); font-size: 13px; }
.rec-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.rec-chips.col { flex-direction: column; align-items: flex-start; }
.rec-p { font-size: 14px; color: var(--muted); }
.planilha { background: #f1f1f1; color: #222; border-radius: 6px; font: 13px Arial, Helvetica, sans-serif; overflow: hidden; box-shadow: 0 24px 60px -30px rgba(0,0,0,.7); border: 1px solid #cfcfcf; }
.planilha-tit { background: #e2e2e2; padding: 6px 10px; font-size: 12px; color: #444; border-bottom: 1px solid #cfcfcf; }
.planilha table { border-collapse: collapse; width: 100%; }
.planilha th, .planilha td { border: 1px solid #d4d4d4; padding: 5px 8px; text-align: left; height: 26px; }
.planilha th { background: #e9e9e9; font-weight: 600; font-size: 12px; }
.placar { display: grid; gap: 18px; min-width: min(420px, 100%); }
.placar-nums { display: grid; gap: 16px; }
.placar .numfio-v { font-size: 38px; }
.placar-trab { font-size: 13px; color: var(--muted); }
.linha-tempo { max-width: 1200px; margin: 0 auto; padding: 12px 0 64px; }
.lt-controles { display: flex; align-items: center; gap: 22px; }
.play { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--marca); color: var(--sobre-marca); box-shadow: 0 10px 24px -12px var(--marca-linha); font-size: 16px; display: grid; place-items: center; transition: transform .2s var(--ease); }
.play:hover { transform: scale(1.05); }
.lt-fio { position: relative; flex: 1; padding-top: 36px; min-width: 0; }
.lt-pilulas { position: absolute; top: 0; left: 0; right: 0; height: 28px; }
.lt-pilula { position: absolute; transform: translateX(-50%); height: 24px; min-width: 34px; padding: 0 8px; border-radius: 9999px; border: 1px solid var(--line-strong); font: 600 11px var(--mono); color: var(--muted); background: var(--bg); transition: all .2s; }
.lt-pilula.feita { color: var(--text); }
.lt-pilula.on { background: var(--acento); border-color: var(--acento); color: #1d2826; }
.lt-pilula:hover { border-color: var(--marca); }
.linha-tempo .dica-teclas { position: static; margin-left: auto; flex: none; }

/* ---------- WhatsApp ---------- */
.tel { width: 390px; height: 844px; border-radius: 52px; background: #0b0f0d; padding: 11px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 8%, transparent), 0 40px 90px -40px rgba(0,0,0,.8); flex: none; }
.tel-tela { position: relative; height: 100%; border-radius: 42px; overflow: hidden; display: flex; flex-direction: column; background: #efeae2;
  font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111b21; color-scheme: light; }
.tel-status { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: #fff; font-size: 14px; font-weight: 600; }
.tel-ilha { width: 108px; height: 30px; border-radius: 20px; background: #0b0f0d; }
.tel-ic { font-size: 10px; letter-spacing: 2px; }
.wa-topo { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 14px 10px; background: #fff; border-bottom: 1px solid #e9edef; }
.wa-volta { font-size: 30px; line-height: 1; color: #008069; margin-top: -4px; }
.wa-av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 1px solid #dfe5e2; color: #00a84a; font-weight: 700; font-size: 18px; flex: none; }
.wa-av.peq { width: 34px; height: 34px; font-size: 14px; }
.wa-nome { flex: 1; display: grid; line-height: 1.2; }
.wa-nome b { font-size: 16px; font-weight: 600; }
.wa-nome small { font-size: 12.5px; color: #667781; }
.wa-ics { color: #54656f; font-size: 18px; letter-spacing: 6px; }
.wa-corpo { position: relative; flex: 1; min-height: 0; background-color: #efeae2; display: flex; }
.wa-rolagem { flex: 1; overflow-y: auto; padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 3px; scrollbar-width: none; }
.wa-rolagem::-webkit-scrollbar { display: none; }
.wa-barra { flex: none; height: 62px; display: flex; align-items: center; gap: 12px; padding: 0 14px 10px; background: #f0f2f5; color: #54656f; font-size: 20px; }
.wa-campo { flex: 1; height: 40px; border-radius: 20px; background: #fff; display: flex; align-items: center; padding: 0 14px; font-size: 15px; color: #8696a0; }
.wa-mic { width: 40px; height: 40px; border-radius: 50%; background: #00a884; color: #fff; display: grid; place-items: center; font-size: 12px; }
.wa-data { align-self: center; margin: 8px 0 6px; padding: 5px 12px; border-radius: 8px; background: #fff; color: #54656f; font-size: 11.5px; font-weight: 500; letter-spacing: .02em; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.wa-nota { align-self: flex-start; margin: 2px 0 6px 6px; font-size: 11.5px; color: #667781; max-width: 78%; }
.wa-grupo { display: flex; flex-direction: column; align-items: flex-start; max-width: 84%; animation: entrar .3s var(--ease); }
.wa-linha { display: flex; width: 100%; animation: entrar .3s var(--ease); }
.wa-grupo .wa-linha { width: auto; }
.wa-linha.meu { justify-content: flex-end; align-self: flex-end; }
.wa-linha.deles { justify-content: flex-start; }
.wa-bolha { position: relative; max-width: 300px; padding: 6px 9px 8px; border-radius: 8px; background: #fff; font-size: 15px; line-height: 1.38; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
.meu .wa-bolha { background: #d9fdd3; }
.wa-bolha.rabo::before { content: ""; position: absolute; top: 0; left: -7px; border-top: 0 solid transparent; border-right: 8px solid #fff; border-bottom: 10px solid transparent; }
.meu .wa-bolha.rabo::before { left: auto; right: -7px; border-right: 0; border-left: 8px solid #d9fdd3; }
.wa-txt { white-space: pre-wrap; }
.wa-hora { float: right; margin: 8px 0 -4px 10px; font-size: 11px; color: #667781; display: inline-flex; gap: 3px; align-items: center; }
.wa-tiques { color: #53bdeb; font-size: 11px; letter-spacing: -3px; }
.wa-botoes { display: grid; width: 100%; max-width: 300px; margin-top: 2px; }
.wa-botoes button { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; background: #fff; color: #027eb5; font-size: 15px; font-weight: 500; border-top: 1px solid #e9edef; }
.wa-botoes button:first-child { border-top: 0; border-radius: 8px 8px 0 0; }
.wa-botoes button:last-child { border-radius: 0 0 8px 8px; }
.wa-botoes button:only-child { border-radius: 8px; }
.wa-botoes button:hover:not(:disabled) { background: #f5f6f6; }
.wa-botoes button:disabled { cursor: default; }
.wa-botoes.usados button { color: #8aaebf; }
.wa-ic-resp { font-size: 13px; }
.wa-img { padding: 3px 3px 22px; }
.wa-img + .wa-hora { position: absolute; right: 10px; bottom: 6px; }
.wa-video { display: grid; gap: 6px; }
.wa-thumb { position: relative; height: 140px; border-radius: 6px; background: linear-gradient(135deg, #12302c, #1d4a43); display: grid; place-items: center; overflow: hidden; }
.wa-thumb::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 10px, color-mix(in srgb, var(--marca) 14%, transparent) 10px 11px); }
.wa-thumb .play { width: 44px; height: 44px; font-size: 14px; position: relative; }
.wa-thumb small { position: absolute; left: 8px; bottom: 6px; color: #fff; font-size: 12px; }
.wa-thumb.peq { height: 74px; }
.wa-thumb.peq .play { width: 30px; height: 30px; font-size: 10px; }
.wa-vtit { font-size: 13px; color: #667781; }
.wa-videos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 6px; }
.wa-contato { display: flex; align-items: center; gap: 10px; min-width: 200px; padding: 4px 0 2px; }
.wa-contato small { color: #667781; margin-left: auto; }
.chamada { display: flex; gap: 10px; align-items: center; }
.chamada > span:first-child { width: 36px; height: 36px; border-radius: 50%; background: #e7f6ee; color: #00a84a; display: grid; place-items: center; }
.chamada small { display: block; color: #667781; font-size: 11px; }
.digitando { display: flex; gap: 4px; padding: 12px 14px; }
.digitando i { width: 7px; height: 7px; border-radius: 50%; background: #8696a0; animation: digita 1.2s infinite; }
.digitando i:nth-child(2) { animation-delay: .15s; } .digitando i:nth-child(3) { animation-delay: .3s; }
@keyframes digita { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
.wa-bolha.manual { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.marca { border-bottom: 2px solid var(--mc); transition: background .2s; cursor: help; }
.marca.on { background: color-mix(in srgb, var(--mc) 22%, transparent); }
.o-modelo { --mc: #3ccfb0; } .o-marco { --mc: #6e9bff; } .o-avaliacao { --mc: #d9a35f; } .o-dor { --mc: #c084fc; }
.wa-folha-veu { position: absolute; inset: 0; z-index: 5; background: rgba(11,20,26,.4); display: flex; align-items: flex-end; animation: entrar .2s; }
.wa-folha { width: 100%; max-height: 74%; overflow-y: auto; background: #fff; border-radius: 18px 18px 0 0; padding: 10px 18px 22px; display: grid; gap: 4px; }
.wa-folha-alca { width: 38px; height: 4px; border-radius: 2px; background: #d1d7db; justify-self: center; margin-bottom: 8px; }
.wa-folha b { font-size: 16px; margin-bottom: 6px; }
.wa-op { display: flex; align-items: center; justify-content: space-between; padding: 11px 2px; border-bottom: 1px solid #f0f2f5; font-size: 15px; cursor: pointer; }
.wa-op input { accent-color: #00a884; width: 18px; height: 18px; }
.wa-enviar { margin-top: 12px; height: 44px; border-radius: 22px; background: #00a884; color: #fff; font-weight: 600; }
.wa-enviar:disabled { background: #b6dfd6; }

/* cartões do paciente (claros) */
.pc { width: 268px; background: #f3f5f2; color: #10261a; border-radius: 8px; padding: 16px 16px 14px; display: grid; gap: 10px; font-family: var(--font); }
.pc-rot { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #00a84a; }
.pc-tit { font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.pc-sub { font-size: 15px; line-height: 1.35; }
.pc-marca { font-size: 13px; font-weight: 600; letter-spacing: -.02em; color: #10261a; opacity: .8; }
.pc-marca i { color: #00a84a; font-style: normal; }
.pc .fio-data { fill: #4a5f52; }
.minicurva { display: block; }

/* ---------- Mesa ---------- */
.fez { display: grid; gap: 18px; }
.fez-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
.hoje-grade { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: start; }
.tarefas { display: grid; gap: 16px; }
.tarefa { position: relative; overflow: hidden; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 0; padding: 26px 28px 26px 0; animation: entrar .35s var(--ease) both; }
.tarefa:nth-of-type(2) { animation-delay: .04s; } .tarefa:nth-of-type(3) { animation-delay: .08s; }
.tarefa:hover { border-color: var(--marca-linha); transform: translateY(-4px); }
.tarefa-n { position: relative; font-size: 120px; line-height: .8; text-align: center; color: color-mix(in srgb, var(--acento) 15%, transparent); }
.tarefa-corpo { display: grid; gap: 10px; }
.tarefa-corpo h3 { font-size: 1.375rem; letter-spacing: -.02em; font-weight: 500; }
.tarefa-corpo p { color: var(--muted); }
.tarefa-chips { display: flex; gap: 16px; flex-wrap: wrap; }
.tarefa-acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.tarefa.saindo { animation: sair .9s var(--ease) forwards; }
.tarefa-feita { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 12px; background: var(--surface); font-size: 18px; font-weight: 600; color: var(--marca); animation: entrar .2s; }
@keyframes sair { 0%, 55% { opacity: 1; max-height: 260px; } 100% { opacity: 0; max-height: 0; padding-block: 0; margin-top: -16px; border-width: 0; } }
.telefone-num { font: 500 14px var(--mono); color: var(--text); user-select: all; }
.vazio-hoje { display: grid; justify-items: start; gap: 14px; padding: 30px 0; }
.vazio-hoje p { font-size: 1.375rem; font-weight: 300; color: var(--muted); }
.proximas { display: grid; gap: 16px; position: sticky; top: 110px; }
.linha-v { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.linha-v li { position: relative; display: grid; grid-template-columns: 40px 14px 1fr; gap: 10px; padding: 10px 0; align-items: start; }
.linha-v li::after { content: ""; position: absolute; left: 56px; top: 28px; bottom: -10px; width: 1px; background: var(--line); }
.linha-v li:last-child::after { display: none; }
.lv-hora { font-size: 13px; color: var(--muted); padding-top: 1px; }
.lv-ponto { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--ok); }
.lv-ponto.e-aguardando { background: var(--label); } .lv-ponto.e-emprestado { background: transparent; border: 1.5px dashed var(--marca); } .lv-ponto.e-vaga { background: var(--warn); }
.linha-v b { display: block; font-weight: 500; font-size: 14.5px; }
.linha-v small { color: var(--muted); font-size: 12.5px; }
/* busca */
.busca-veu { position: fixed; inset: 0; z-index: 80; background: var(--veu-bg); display: flex; justify-content: center; padding-top: 14vh; padding-inline: 16px; animation: entrar .2s; }
.busca { width: min(620px, 100%); max-height: 64vh; display: flex; flex-direction: column; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; box-shadow: 0 30px 80px -30px rgba(0,0,0,.45); }
.busca input { height: 60px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--text); font: 400 18px var(--font); padding: 0 22px; outline: none; }
.busca-lista { overflow-y: auto; padding: 8px; }
.busca-grupo { font-size: 11px; letter-spacing: .2em; color: var(--marca); font-weight: 600; padding: 12px 12px 6px; }
.busca-item { width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 15px; }
.busca-item small { color: var(--muted); }
.busca-item.on { background: color-mix(in srgb, var(--marca) 10%, transparent); }
.busca-vazio { padding: 22px; color: var(--muted); }
.busca-pe { border-top: 1px solid var(--line); padding: 10px 14px; }
.busca-pe .dica-teclas { position: static; background: none; border: 0; padding: 0; max-width: none; }
/* agenda */
.regua { font-size: 14px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.regua b { color: var(--text); font-weight: 600; }
.grade-rolagem { overflow-x: auto; padding-bottom: 6px; }
.grade { display: grid; grid-template-columns: 78px repeat(3, minmax(230px, 1fr)); min-width: 780px; border-top: 1px solid var(--line); }
.grade-cab { display: flex; align-items: center; gap: 10px; padding: 12px 10px; font-weight: 600; font-size: 15px; border-bottom: 1px solid var(--line); }
.grade-hora { position: relative; padding: 12px 8px 0 0; text-align: right; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.grade-hora.pico, .celula.pico { background: color-mix(in srgb, var(--warn) 5%, transparent); }
.pico-leg { position: absolute; left: 4px; top: 36px; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10.5px; letter-spacing: .08em; color: var(--warn); white-space: nowrap; opacity: .85; }
.celula { position: relative; min-height: 76px; padding: 4px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
.celula.livre { display: flex; align-items: center; justify-content: center; color: color-mix(in srgb, var(--text) 25%, transparent); font-size: 12px; cursor: pointer; }
.celula.livre.sel { outline: 2px dashed var(--marca-linha); outline-offset: -4px; border-radius: 12px; }
.slot { position: relative; height: 100%; display: grid; gap: 4px; align-content: start; padding: 8px 10px; border-radius: 12px; box-shadow: 0 1px 0 color-mix(in srgb, var(--text) 5%, transparent); background: var(--surface); border: 1px solid var(--line); font-size: 13px; cursor: grab; transition: border-color .2s, transform .2s var(--ease); --no-fundo: var(--surface); }
.slot:hover { border-color: var(--marca-linha); }
.slot.sel { outline: 2px solid var(--marca); outline-offset: 1px; }
.slot-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.slot-topo b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-topo .estado { font-size: 11.5px; }
.slot-meio { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.slot-meio .n { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
.slot-meio .mini { width: 64px; }
.slot small { color: var(--muted); font-size: 11.5px; line-height: 1.35; }
.slot-faltou { border-color: color-mix(in srgb, var(--risk) 45%, transparent); }
.slot-vaga { border-style: dashed; border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 4%, transparent); cursor: default; }
.slot-reocupado { border-color: color-mix(in srgb, var(--marca) 30%, transparent); }
.slot-emprestado { border-style: dashed; border-color: var(--marca-linha); }
.emprestado-nomes { position: relative; height: 22px; }
.dono-marca { position: absolute; left: 0; top: -6px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; color: transparent; -webkit-text-stroke: 1px color-mix(in srgb, var(--text) 22%, transparent); }
.emprestado-nomes b { position: relative; font-size: 14px; font-weight: 600; padding-left: 52px; }
.volta { font-size: 11.5px; color: var(--marca); }
.mini-onda { display: flex; gap: 4px; }
.slot-abrir { justify-self: start; font-size: 12px; color: var(--marca); margin-top: 2px; }
.aviso-pico { position: absolute; z-index: 20; left: 4px; right: 4px; top: calc(100% - 4px); padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--warn) 55%, transparent); box-shadow: 0 24px 50px -24px #000; font-size: 13.5px; display: grid; gap: 8px; animation: entrar .25s var(--ease); --no-fundo: var(--surface); }
.anel-mono { position: relative; display: inline-grid; place-items: center; flex: none; }
.anel-mono svg { position: absolute; inset: 0; }
.anel-mono i { font-style: normal; font-size: 11px; font-weight: 600; }
/* painel do paciente */
.pp { display: grid; gap: 22px; }
.pp-bloco { display: grid; gap: 8px; }
.pp-bloco p { color: var(--muted); font-size: 14.5px; }
.msgs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); }
.msgs li { padding: 8px 12px; border-radius: 12px; background: color-mix(in srgb, var(--text) 3%, transparent); border: 1px solid var(--line); }
/* fios */
.afinam { display: grid; gap: 14px; }
.afinam-cab, .cartao-cab { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.afinam-cols { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; align-items: end; }
.afinam-col { display: grid; justify-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.pontos { display: flex; flex-wrap: wrap-reverse; justify-content: center; gap: 4px; width: 46px; }
.pontos i { width: 8px; height: 8px; border-radius: 50%; background: color-mix(in srgb, var(--text) 40%, transparent); }
.afinam-col.degrau .pontos i { background: var(--risk); }
.afinam-col.degrau { color: var(--risk); font-weight: 600; }
.filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ordem { margin-left: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.ordem select { background: var(--surface); color: var(--text); border: 1px solid var(--line-strong); border-radius: 9999px; padding: 6px 12px; font: inherit; }
.fios-lista { display: grid; gap: 10px; }
.fio-linha { border: 1px solid var(--line); box-shadow: var(--sombra); border-radius: 18px; background: var(--surface); --no-fundo: var(--surface); transition: border-color .25s; }
.fio-linha:hover, .fio-linha.aberta { border-color: var(--marca-linha); }
.fio-linha-btn { width: 100%; text-align: left; display: grid; grid-template-columns: 260px minmax(0, 1fr) 170px; gap: 22px; align-items: center; padding: 14px 20px; }
.fl-quem { display: flex; align-items: center; gap: 12px; min-width: 0; }
.fl-quem b { display: block; font-weight: 600; }
.fl-quem small { color: var(--muted); font-size: 12.5px; }
.fl-tensao { display: grid; gap: 4px; justify-items: start; }
.fl-tensao small { color: var(--muted); font-size: 12px; line-height: 1.3; }
.fl-detalhe { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; padding: 6px 20px 22px; border-top: 1px solid var(--line); padding-top: 18px; animation: entrar .3s var(--ease); }
.fl-detalhe > div { display: grid; gap: 8px; align-content: start; }
.fl-detalhe p { color: var(--muted); font-size: 14px; }
/* renovações */
.kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
.kanban-col { display: grid; gap: 12px; padding: 14px; border-radius: 22px; background: color-mix(in srgb, var(--text) 2%, transparent); border: 1px solid var(--line); }
.kanban-cab { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; }
.contagem { font-size: 13px; color: var(--muted); }
.k-atrasado { border-color: color-mix(in srgb, var(--risk) 30%, transparent); }
.renov { display: grid; gap: 12px; padding: 18px; border-radius: 16px; }
.renov.chegou { animation: chegar 1.1s var(--ease); }
@keyframes chegar { from { opacity: 0; transform: translateX(-60px); } }
.r-atrasado { border-color: color-mix(in srgb, var(--risk) 45%, transparent); }
.vazio { color: var(--muted); font-size: 13.5px; padding: 6px; }
.folga { display: grid; gap: 8px; }
.folga-barra { position: relative; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--text) 8%, transparent); overflow: hidden; }
.folga-tipico { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--text) 16%, transparent) 0 4px, transparent 4px 8px); }
.folga-barra b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; transition: width .6s var(--ease); }
.folga-barra b.ok { background: var(--ok); } .folga-barra b.warn { background: var(--warn); } .folga-barra b.risk { background: var(--risk); }
.folga-txt { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.folga-txt span:first-child { font-weight: 600; }
.t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-risk { color: var(--risk); }
.lib-form { display: grid; gap: 6px; }
.lib-form label { font-size: 12.5px; color: var(--muted); }
.lib-form input, .campos input { height: 40px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); padding: 0 12px; font: 500 14px var(--font); }
.lib-form input:hover, .campos input:hover { border-color: color-mix(in srgb, var(--text) 26%, transparent); }
.tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabela th { text-align: left; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--label); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.tabela td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tabela td small { display: block; color: var(--muted); font-size: 12px; }
/* fila */
.fila-grade { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.fila-grade > section { display: grid; gap: 16px; }
.vaga { display: grid; gap: 16px; border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.vaga.feita { display: flex; align-items: center; gap: 16px; border-color: var(--marca-linha); }
.vaga > .btn, .vaga .btn { justify-self: start; }
.k-atrasado .rotulo { color: var(--risk); }
.vaga h3 { font-size: 1.25rem; font-weight: 500; letter-spacing: -.02em; }
.vaga small { color: var(--muted); font-size: 13px; }
.vaga-cab { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.vaga-alvo { width: 64px; height: 44px; border-radius: 14px; border: 1.5px dashed color-mix(in srgb, var(--warn) 60%, transparent); display: grid; place-items: center; font-size: 12px; color: var(--warn); transition: background .3s; flex: none; }
.vaga-alvo.recebendo { background: color-mix(in srgb, var(--marca) 12%, transparent); border-color: var(--marca); }
.onda { display: grid; gap: 8px; padding: 14px; border-radius: 18px; background: color-mix(in srgb, var(--text) 3%, transparent); }
.onda-cab { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

.onda-pessoa { display: flex; align-items: center; gap: 12px; padding: 6px 0; transition: transform 1.1s var(--ease), opacity .6s; }

.onda-pessoa small { color: var(--muted); font-size: 12.5px; }
.onda-estado { margin-left: auto; font-size: 12px; color: var(--muted); }
.onda-pessoa.vencedor { transform: translate(min(30vw, 440px), -150px) scale(.9); }
.onda-pessoa.esmaece { opacity: .25; }
.regra-fila { font-size: 14px; color: var(--muted); padding: 12px 16px; border-radius: 16px; border: 1px solid var(--line); }
.regras-fila { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.regras-fila div { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--text) 3%, transparent); border: 1px solid var(--line); }
.regras-fila b { font-size: 13px; font-weight: 600; }
.regras-fila span { font-size: 12.5px; color: var(--muted); }
.fila-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.fila-lista li { display: grid; grid-template-columns: 30px 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.fila-lista b { display: block; font-weight: 500; }
.fila-lista small { color: var(--muted); font-size: 12.5px; }
.fila-n { font-size: 13px; color: var(--label); font-variant-numeric: tabular-nums; }
/* radar */
.radar { list-style: none; margin: 0; padding: 0; display: grid; }
.radar-item { position: relative; display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--line); }
.radar-n { position: relative; font-size: 76px; line-height: .8; color: color-mix(in srgb, var(--text) 7%, transparent); text-align: left; }
.radar-corpo { display: grid; gap: 10px; }
.radar-linha { display: flex; align-items: center; gap: 14px; }
.radar-linha h3 { font-size: 1.375rem; font-weight: 500; letter-spacing: -.02em; }
.porque { justify-self: start; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.porque:hover { color: var(--text); }
.porque-lista { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--muted); display: grid; gap: 4px; }
.feito-por { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.radar-item.feito .radar-corpo { opacity: .6; }
.regras { margin: 0; padding-left: 20px; display: grid; gap: 14px; font-size: 15px; }

/* ---------- galeria ---------- */
.gal-grade { display: grid; grid-template-columns: 280px 310px minmax(0, 1fr); gap: 40px; align-items: start; }
.gal-lista { display: grid; gap: 8px; }
.gal-item { text-align: left; display: grid; gap: 6px; justify-items: start; padding: 14px 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); transition: border-color .2s, transform .2s var(--ease); }
.gal-item:hover { border-color: var(--marca-linha); transform: translateX(4px); }
.gal-item.on { border-color: var(--marca); background: var(--surface-2); }
.gal-item b { font-weight: 500; font-size: 15.5px; }
.gal-tel { display: grid; gap: 14px; justify-items: center; position: sticky; top: 110px; }
.gal-fone { zoom: .78; }
.variantes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.cinza { filter: grayscale(1); }
.reiniciar { font-size: 13px; }
.gal-porque { display: grid; gap: 22px; position: sticky; top: 110px; }
.pq-bloco { display: grid; gap: 6px; }
.pq-bloco h4 { font-size: 1.05rem; font-weight: 600; }
.pq-bloco p { color: var(--muted); }
.origens { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; }
.origens li { display: flex; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); transition: background .2s, border-color .2s; cursor: help; }
.origens li i { width: 4px; border-radius: 2px; background: var(--mc); flex: none; }
.origens li.on { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 12%, transparent); }
.origens b { display: block; font-weight: 600; font-size: 14px; }
.origens small { color: var(--muted); font-size: 12.5px; }
.destaque-txt { font-size: 1.375rem; font-weight: 700; letter-spacing: -.02em; }

/* ---------- fisio ---------- */
.fisio-grade { grid-template-columns: minmax(0, 1fr) 390px; align-items: center; gap: 60px; }
.fisio-txt { display: grid; gap: 22px; }
.lista-pontos { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; color: var(--muted); }
.lista-pontos li { position: relative; padding-left: 22px; }
.lista-pontos li::before { content: ""; position: absolute; left: 0; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--marca); }
.celular-fio { width: 390px; max-width: 100%; height: 844px; border-radius: 52px; background: #0b0f0d; padding: 11px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 8%, transparent), 0 40px 90px -40px #000; zoom: .82; }
.cf-tela { height: 100%; border-radius: 42px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 0 20px 18px; --no-fundo: var(--bg); }
.cf-status { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-size: 14px; font-weight: 600; }
.cf-tit { font-size: 30px; letter-spacing: -.03em; line-height: 1.05; }
.cf-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cf-tabs button { min-height: 48px; padding: 6px 10px; border-radius: 14px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); text-align: left; line-height: 1.25; }
.cf-tabs button.on { border-color: var(--marca); color: var(--text); background: color-mix(in srgb, var(--marca) 6%, transparent); }
.cf-corpo { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; animation: entrar .3s var(--ease); scrollbar-width: none; }
.cf-corpo h3 { font-size: 21px; font-weight: 500; letter-spacing: -.02em; }
.segmentos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.segmentos i { height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--text) 10%, transparent); }
.segmentos i.feito { background: color-mix(in srgb, var(--marca) 60%, transparent); } .segmentos i.atual { background: var(--marca); }
.fs-passo { font-size: 11px; letter-spacing: .2em; color: var(--label); font-weight: 600; }
.opcoes { display: grid; gap: 8px; }
.opcao { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px 8px 8px; border-radius: 16px; border: 1px solid var(--line); text-align: left; transition: transform .2s var(--ease), border-color .2s, background .2s; }
.opcao:hover { transform: translateX(4px); border-color: color-mix(in srgb, var(--marca) 45%, transparent); background: color-mix(in srgb, var(--marca) 4%, transparent); }
.opcao.on { border-color: var(--marca); background: color-mix(in srgb, var(--marca) 6%, transparent); }
.opcao-n { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-strong); display: grid; place-items: center; font: 600 13px var(--mono); flex: none; }
.opcao-t { flex: 1; font-size: 15px; }
.opcao-r { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; }
.opcao.on .opcao-r { border: 6px solid var(--marca); }
.videos-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.video-op { display: grid; gap: 6px; padding: 6px; border-radius: 16px; border: 1px solid var(--line); text-align: left; font-size: 13px; min-height: 48px; }
.video-op.on { border-color: var(--marca); }
.video-op b { font-weight: 500; padding: 0 4px 4px; }
.video-thumb { position: relative; display: block; height: 72px; border-radius: 11px; background: var(--bg-deep); overflow: hidden; }
.video-thumb svg { width: 100%; height: 100%; }
.video-thumb small { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--text); }
.previa-wa { padding: 14px; border-radius: 18px; background: #efeae2; color: #111b21; }
.previa-wa .wa-bolha { max-width: none; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 14.5px; }
.fs-acoes { display: flex; justify-content: space-between; align-items: center; margin-top: auto; gap: 10px; }
.fs-acoes .btn-principal { margin-left: auto; }
.fs-feito { display: grid; gap: 14px; justify-items: start; padding-top: 10px; }
.campos { display: grid; gap: 10px; }
.campos label { display: grid; gap: 5px; font-size: 12.5px; color: var(--muted); }
.cf-rodape { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.cf-fio { display: grid; grid-template-columns: 1fr 90px; align-items: center; font-size: 13px; color: var(--muted); }

/* ---------- pulso ---------- */
.pulso-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
.pulso-grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pulso-grade > .cartao { display: grid; gap: 16px; align-content: start; }
.pulso-grade .largo { grid-column: 1 / -1; }
.pg-pulso .numfio-v, .placar .numfio-v { color: var(--text); }
.grafico .eixo { font: 500 11px var(--font); fill: var(--muted); }
.grafico .valor { font: 700 13px var(--font); fill: var(--text); }
.retorno { display: grid; gap: 6px; }
.retorno-barra { height: 14px; border-radius: 7px; background: color-mix(in srgb, var(--text) 7%, transparent); overflow: hidden; }
.retorno-barra b { display: block; height: 100%; background: linear-gradient(90deg, var(--fio-a), var(--fio-b), var(--fio-c)); border-radius: 7px; }
.retorno-leg { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.retorno-txt { font-size: 1.25rem; font-weight: 300; }
.retorno-txt b { font-weight: 700; }
.semana { display: grid; gap: 14px; overflow-x: auto; }
.semana-grade { display: grid; grid-template-columns: 44px repeat(5, minmax(90px, 1fr)); gap: 4px 10px; min-width: 560px; }
.semana-dia { font-size: 12.5px; color: var(--text); text-transform: lowercase; }
.semana-dia small { margin-left: 6px; color: var(--muted); }
.semana-hora { font-size: 11.5px; color: var(--muted); text-align: right; padding-top: 2px; }
.semana-hora.pico { color: var(--warn); }
.semana-cel { display: flex; gap: 6px; align-items: center; height: 20px; padding: 0 6px; border-radius: 6px; }
.semana-cel.pico { background: color-mix(in srgb, var(--warn) 5%, transparent); }
.semana-cel.feriado { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--text) 5%, transparent) 0 5px, transparent 5px 10px); font-size: 11px; color: var(--muted); justify-content: center; }
.semana-cel i, .semana-leg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.p-veio { background: var(--marca); } .p-falta { border: 1.6px solid var(--risk); } .p-desm { border: 1.4px dashed var(--label); } .p-vazio { background: color-mix(in srgb, var(--text) 5%, transparent); }
.p-fila { background: var(--marca); box-shadow: 0 0 0 3px color-mix(in srgb, var(--marca) 22%, transparent); }
.semana-leg { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.semana-leg span { display: inline-flex; gap: 6px; align-items: center; }
.motivos { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.motivos li { display: grid; grid-template-columns: 170px minmax(0, 1fr) 28px; gap: 12px; align-items: center; font-size: 14px; }
.motivo-barra { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text) 6%, transparent); }
.motivo-barra b { display: block; height: 100%; border-radius: 3px; background: color-mix(in srgb, var(--text) 55%, transparent); }
.motivos li:nth-child(2) .motivo-barra b { background: var(--cause-pico); } .motivos li:nth-child(3) .motivo-barra b { background: var(--cause-rampa); }
.motivos em { font-style: normal; font-variant-numeric: tabular-nums; text-align: right; }
.rodape-pulso { font-size: 13px; color: var(--muted); }

/* ---------- história: controles dentro da cena ---------- */
.cena-topo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; position: relative; z-index: 1; }
.cena-ver { font-size: 13px; color: var(--muted); }
.lt-botoes { display: flex; align-items: center; gap: 8px; flex: none; }
.passo { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line-strong); color: var(--text); font-size: 15px; display: grid; place-items: center; transition: border-color .2s, transform .2s var(--ease); }
.passo:hover:not(:disabled) { border-color: var(--marca); color: var(--marca); transform: scale(1.06); }
.passo:disabled { opacity: .3; }

/* ---------- guia "Experimente": pílula no canto do menu, cartão logo abaixo ---------- */
.guia-pilula { position: fixed; z-index: 45; top: calc(env(safe-area-inset-top, 0px) + 18px); right: max(16px, env(safe-area-inset-right, 0px), calc((100vw - 1300px) / 2));
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--line-strong);
  font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--text); transition: border-color .2s, background .2s; }
.guia-pilula:hover, .guia-pilula.on { border-color: var(--acento); }
.guia-pilula i { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--acento); }
.guia-pilula i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid var(--acento); animation: pulso 1.6s ease-out infinite; }
.guia { position: fixed; z-index: 45; right: max(16px, env(safe-area-inset-right, 0px), calc((100vw - 1300px) / 2)); width: 320px; padding: 14px 16px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: 0 24px 60px -24px rgba(0,0,0,.45); animation: guiaEntra .35s var(--salto); transform-origin: top right; }
.guia::before { content: ""; position: absolute; top: -6px; right: 44px; width: 10px; height: 10px; transform: rotate(45deg); background: var(--surface); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
@keyframes guiaEntra { from { opacity: 0; transform: translateY(-6px) scale(.96); } }
.guia ol { margin: 0; padding: 0; list-style: none; counter-reset: g; display: grid; gap: 8px; }
.guia li { counter-increment: g; position: relative; padding-left: 28px; font-size: 13.5px; line-height: 1.45; color: var(--text); }
.guia li::before { content: counter(g); position: absolute; left: 0; top: 0; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font: 700 10.5px var(--mono);

  var { useState: useState6, useEffect: useEffect7 } = React;
  var h6 = React.createElement;
  function lerHash() {
    let raw = (location.hash || "").replace(/^#/, "") || "inicio";
    const foto = /-foto$/.test(raw);
    raw = raw.replace(/-foto$/, "");
    document.documentElement.classList.toggle("foto", foto);
    const m = raw.match(/^historia(?:-c([1-7]))?(?:-(sem|com))?$/);
    if (m) return { rota: "historia", cap: m[1] ? Number(m[1]) : 1, versao: m[2] || "com", chave: raw };
    return { rota: raw, chave: raw };
  }
  var GUIAS = {

    agenda: ["Clique na sess\xE3o de um paciente depois das 11h e tecle A: a vaga vai sozinha para a fila.", "Tecle V, F ou D para os outros registros; F n\xE3o abre vaga.", "Arraste a Dona C\xE9lia para as 7h: o Fio avisa que ela depende de carona no pico."],
    fios: ["Clique em um fio para abrir o tratamento inteiro.", "Filtre por \u201CRenova\xE7\xE3o pendente\u201D para ver quem est\xE1 na emenda entre a 5\xAA e a 6\xAA sess\xE3o."],

  function App() {
    const [r, setR] = useState6(lerHash);
    useEffect7(() => {

        setR(lerHash());

      addEventListener("hashchange", f);
      return () => removeEventListener("hashchange", f);
    }, []);
    const telas = { inicio: Capa, whatsapp: Galeria, mesa: Hoje, agenda: Agenda, fios: Fios, renovacoes: Renovacoes, fila: Fila, radar: Radar, fisio: Fisio, pulso: Pulso };
    let tela;
    if (r.rota === "historia") tela = h6(Historia, { key: r.chave, capInicial: r.cap, versaoInicial: r.versao });
    else tela = h6(telas[r.rota] || Capa, { key: r.chave });
    return h6(Provedor, null, tela, h6(Guia, { key: "g" + r.rota, rota: r.rota, itens: GUIAS[r.rota] }), h6(Toast));
  }
